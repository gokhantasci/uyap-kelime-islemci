name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create WordPress Plugin Archive
        run: |
          mkdir -p dist
          cd wordpress-plugin
          zip -r ../dist/uyap-kelime-islemci-wordpress-plugin.zip uyap-kelime-islemci/ -x "*.git*"
          cd ..

      - name: Create Offline Web Editor Package
        run: |
          mkdir -p dist
          zip -r dist/uyap-web-editor-offline.zip index.html embed.html embed.js robots.txt sitemap.xml llms.txt assets/ CNAME README.md LICENSE -x "*.git*"

      - name: Create Windows Desktop & Print Suite Package
        run: |
          mkdir -p dist
          zip -r dist/print-to-udf-windows-suite.zip install.ps1 uninstall.ps1 PrintToUDF_Watcher.ps1 open_in_editor.py print_to_udf.py index.html embed.html embed.js assets/ README.md LICENSE -x "*.git*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: UYAP Kelime İşlemci ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/uyap-kelime-islemci-wordpress-plugin.zip
            dist/uyap-web-editor-offline.zip
            dist/print-to-udf-windows-suite.zip

